[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jitsudb"
version = "0.1.0"
description = "Local-first BJJ instructional video search engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.*",
    "uvicorn[standard]==0.34.*",
    "faster-whisper==1.1.*",
    "sentence-transformers==3.4.*",
    "einops>=0.7",
    "scikit-learn>=1.3",
    "chromadb==0.6.*",
    "pydantic==2.11.*",
    "pydantic-settings==2.8.*",
    "PyYAML==6.0.*",
    "loguru==0.7.*",
    "ffmpeg-python==0.2.*",
    "yt-dlp==2025.*",
    "pynvml>=13.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.*",
    "pytest-asyncio==0.25.*",
    "httpx==0.28.*",
]
eval = [
    "ragas>=0.2",
    "datasets>=2.18",
    "langchain-community>=0.2",
]

[project.scripts]
jitsudb-server = "jitsudb.api.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["jitsudb"]
